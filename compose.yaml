services:
  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["scratch-data:/app/data"]
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  scratch-data:
